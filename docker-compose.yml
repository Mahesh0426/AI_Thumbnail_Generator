version: "3.9"

services:
  server:
    build: ./server
    container_name: thumbnail-server
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"
    networks:
      - fullstack-net
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - VITE_BASE_URL=http://localhost:3000
    container_name: thumbnail-client
    ports:
      - "5173:3000"
    networks:
      - fullstack-net
    depends_on:
      - server
    restart: unless-stopped

networks:
  fullstack-net:
    driver: bridge
